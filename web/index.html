<!DOCTYPE html>
<html lang="es">
<head>
  <!-- Flutter reemplaza $FLUTTER_BASE_HREF con el valor de --base-href -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="15-Puzzle Flutter: rompecabezas deslizante.">
  <meta name="theme-color" content="#F57C00">

  <!-- iOS -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="15-Puzzle">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>15-Puzzle Flutter</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>

  <!-- PWA: registra el service worker que guarda los archivos en caché
       para que el juego funcione sin conexión. -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker
          .register('flutter_service_worker.js')
          .catch(function (e) { console.warn('Service worker no registrado:', e); });
      });
    }
  </script>
</body>
</html>
